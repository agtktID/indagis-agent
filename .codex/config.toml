#:schema https://developers.openai.com/codex/config-schema.json

# ECC Tools generated Codex baseline
#
# Every npx-launched server below is pinned to an exact version. The generated
# baseline used bare names and @latest, which resolves at run time: the code a
# contributor executes would then depend on when they ran it, and a compromised
# or simply changed release would land without any diff to review. Bump these
# deliberately.
#
# mcp_servers.exa is a remote endpoint, so there is no version to pin — it is
# whatever the operator serves, and it sees the queries sent to it.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github@2025.4.8"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.0.5"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory@2026.8.31"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.80", "--extension"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@2026.8.31"]

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"